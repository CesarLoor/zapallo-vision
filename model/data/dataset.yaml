# Dataset YAML para ZapalloAI — YOLOv11n-cls
# Las clases están en orden alfabético porque YOLO asigna índices
# según el orden alfabético de las carpetas en train/.
#
# Estructura esperada:
#   model/data/processed/
#     ├── train/
#     │   ├── downy_mildew/
#     │   ├── healthy/
#     │   ├── leaf_curl/
#     │   ├── mosaic_virus/
#     │   └── red_beetle/
#     ├── val/   (mismas subcarpetas)
#     └── test/  (mismas subcarpetas)

path: ./processed
train: train
val: val
test: test

nc: 5
names:
  0: downy_mildew
  1: healthy
  2: leaf_curl
  3: mosaic_virus
  4: red_beetle
